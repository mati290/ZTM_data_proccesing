services:
  minio:
    image: cgr.dev/chainguard/minio:latest    # Docker Hub images removed in Sept 2026
    user: root                                # chainguard image needs root to write /data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data

  ingestion:
    build: .
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - minio
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local dev only!
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./bronze_to_silver.py:/opt/airflow/src/bronze_to_silver.py
    depends_on:
      - minio

volumes:
  minio_data: