services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  ingestion:
    build: .
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      - minio
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW__CORE__FERNET_KEY in .env}"
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./bronze_to_silver.py:/opt/airflow/src/bronze_to_silver.py
      - airflow_metadata:/opt/airflow
    depends_on:
      - minio

volumes:
  minio_data:
  airflow_metadata:
