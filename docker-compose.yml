services:
  minio:
    # The Chainguard public registry provides the free `latest` channel.
    # Pin this to a digest before using the stack outside local development.
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ingestion:
    build: .
    environment:
      ZTM_API_KEY: ${ZTM_API_KEY:?set ZTM_API_KEY in .env}
      MINIO_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      S3_ENDPOINT_URL: http://minio:9000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      DEGRADED_CYCLES_ALERT_THRESHOLD: ${DEGRADED_CYCLES_ALERT_THRESHOLD:-10}
    depends_on:
      - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "check_ingestion_health.py"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW__CORE__FERNET_KEY in .env}"
      PYTHONPATH: /opt/airflow/src
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./bronze_to_silver.py:/opt/airflow/src/bronze_to_silver.py
      - ./silver_to_gold.py:/opt/airflow/src/silver_to_gold.py
      - ./late_data.py:/opt/airflow/src/late_data.py
      - ./ingestion_contract.py:/opt/airflow/src/ingestion_contract.py:ro
      - airflow_metadata:/opt/airflow
      - ./check_airflow_health.py:/opt/airflow/src/check_airflow_health.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - /opt/airflow/src/check_airflow_health.py
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  minio_data:
  airflow_metadata:
