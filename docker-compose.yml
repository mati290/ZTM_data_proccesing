services:
  minio:
    # The Chainguard public registry provides the free `latest` channel.
    # Pin this to a digest before using the stack outside local development.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  ingestion:
    build: .
    environment:
      ZTM_API_KEY: ${ZTM_API_KEY:?set ZTM_API_KEY in .env}
      MINIO_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      S3_ENDPOINT_URL: http://minio:9000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      DEGRADED_CYCLES_ALERT_THRESHOLD: ${DEGRADED_CYCLES_ALERT_THRESHOLD:-10}
    depends_on:
      - minio
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?set AIRFLOW__CORE__FERNET_KEY in .env}"
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./dags:/opt/airflow/dags
      - ./bronze_to_silver.py:/opt/airflow/src/bronze_to_silver.py
      - airflow_metadata:/opt/airflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      - minio
    restart: unless-stopped

volumes:
  minio_data:
  airflow_metadata:
