name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.10

      - name: Check lint
        run: ruff check ingest.py bronze_to_silver.py dags tests

      - name: Check formatting
        run: ruff format --check ingest.py bronze_to_silver.py dags tests

      - name: Run tests
        run: python -B -m unittest discover -s tests -v
