name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.10

      - name: Check lint
        run: ruff check ingest.py bronze_to_silver.py dags tests analysis

      - name: Check formatting
        run: ruff format --check ingest.py bronze_to_silver.py dags tests analysis

      - name: Run tests
        run: python -B -m unittest discover -s tests -v

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZTM_API_KEY: ci-placeholder
      MINIO_USER: ci-minio-user
      MINIO_PASSWORD: ci-minio-password
      AIRFLOW__CORE__FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build application and Airflow images
        run: docker compose build ingestion airflow

      - name: Verify the public MinIO image can be pulled
        run: docker compose pull minio

      - name: Initialize Airflow metadata database
        run: docker compose run --rm --no-deps airflow airflow db migrate

      - name: Verify Airflow can discover the DAG
        run: |
          docker compose run --rm --no-deps airflow airflow dags list --local | tee dags.txt
          grep -q "bronze_to_silver_hourly" dags.txt

      - name: Verify the Airflow image includes transformation dependencies
        run: docker compose run --rm --no-deps airflow python -c "import bronze_to_silver"
