name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.10

      - name: Check lint
        run: ruff check ingest.py bronze_to_silver.py silver_to_gold.py dags tests analysis

      - name: Check formatting
        run: ruff format --check ingest.py bronze_to_silver.py silver_to_gold.py dags tests analysis

      - name: Run tests
        run: python -B -m unittest discover -s tests -v

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZTM_API_KEY: ci-placeholder
      MINIO_USER: ci-minio-user
      MINIO_PASSWORD: ci-minio-password
      AIRFLOW__CORE__FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build application and Airflow images
        run: docker compose build ingestion airflow

      - name: Verify the public MinIO image can be pulled
        run: docker compose pull minio

      - name: Initialize Airflow metadata database
        run: docker compose run --rm --no-deps airflow airflow db migrate

      - name: Verify all Airflow DAGs load without import errors
        run: |
          docker compose run --rm --no-deps airflow python -c "from airflow.models import DagBag; bag = DagBag(include_examples=False); expected = {'bronze_to_silver_hourly', 'silver_to_gold_hourly', 'reprocess_late_data_hourly'}; missing = expected - set(bag.dags); assert not bag.import_errors, bag.import_errors; assert not missing, f'Missing DAGs: {sorted(missing)}'; print('Loaded DAGs:', sorted(expected))"

      - name: Verify the Airflow image includes transformation dependencies
        run: docker compose run --rm --no-deps airflow python -c "import bronze_to_silver, silver_to_gold"

      - name: End-to-end smoke test (MinIO -> Silver on production DuckDB)
        run: |
          docker compose up -d minio
          sleep 10
          docker compose run --rm --no-deps -v "$PWD/tests/smoke_e2e.py:/tmp/smoke_e2e.py" airflow python /tmp/smoke_e2e.py
